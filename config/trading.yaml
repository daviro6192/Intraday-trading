  - symbol: WIF
    coingecko_id: dogwifcoin
    binance_perp: WIFUSDT

# Fallback statico se lo screener non riesce a completare la scelta (Binance
# o Claude non raggiungibili all'avvio della sessione): mai lasciare che
# l'avvio fallisca del tutto per questo.
symbols_fallback:
  fixed:
    symbol: BTC
    coingecko_id: bitcoin
    binance_perp: BTCUSDT
  altcoin:
    symbol: SOL
    coingecko_id: solana
    binance_perp: SOLUSDT
  outsider:
    symbol: INJ
    coingecko_id: injective-protocol
    binance_perp: INJUSDT

cycles:
  # Agente 1 (fondamentale) + Agente 2 (strategia): chiamano Claude, girano a
  # bassa frequenza per tenere sotto controllo costo e latenza.
  slow_cycle_interval_minutes: 15
  # Agente 3 (ordini) + Agente 4 (gate di rischio deterministico): nessuna
  # chiamata Claude, girano ad alta frequenza per abilitare centinaia di
  # trade/giorno.
  fast_cycle_interval_seconds: 5

execution:
  starting_cash_usdt: 100000.0
  default_leverage: 3
  # Commissioni (non ottenibili da un endpoint pubblico, sono
  # account-specific: restano assunzioni qui, aggiornabili qui senza
  # toccare il codice). 0.1% è lo standard non-VIP di Binance SPOT; sui
  # futures USDT-M lo standard non-VIP è più basso (maker 0.02%, taker
  # 0.04%) — usato qui comunque 0.1% per entrambe su richiesta esplicita.
  maker_fee_pct: 0.001
  taker_fee_pct: 0.001
  funding_interval_hours: 8
  # Usato solo se Binance non è raggiungibile al momento dell'accrual.
  default_funding_rate_fallback_pct: 0.0001
  maintenance_margin_rate_pct: 0.005

risk_limits:
  # Rischio massimo per singolo trade, come frazione dell'equity del conto.
  max_risk_per_trade_pct: 0.01
  # Se la perdita giornaliera realizzata+aperta supera questa frazione
  # dell'equity, il risk manager blocca nuovi ordini per il resto della giornata.
  max_daily_loss_pct: 0.03
  # Numero massimo di posizioni aperte contemporaneamente (sui 3 simboli tracciati).
  max_concurrent_positions: 3
  # Esposizione massima (valore nozionale) su un singolo strumento, come frazione dell'equity.
  # Con stop ATR stretti (voluti per aumentare la frequenza dei trade), la
  # size "grezza" richiesta dalla formula di rischio supera quasi sempre
  # questo tetto: è lui, in pratica, a fare da SOFFITTO di sicurezza — la
  # quota reale investita per trade è decisa dalla Strategy Agent in base
  # alla conviction (vedi agents/strategy_agent.py e agents/order_agent.py),
  # entro questo limite massimo.
  max_exposure_per_symbol_pct: 0.20
  # Rapporto minimo reward/risk richiesto per un intent.
  min_reward_risk_ratio: 1.5
  # Leva massima consentita per posizione, indipendentemente da cosa propone Claude.
  max_leverage: 10
  # Il profitto atteso di un trade deve superare le fee di round-trip (+ funding
  # stimato) moltiplicate per questo fattore, altrimenti l'intent viene bloccato.
  min_profit_over_fees_multiple: 1.5

claude:
  fundamental_agent_model: claude-sonnet-5
  strategy_agent_model: claude-sonnet-5
  risk_review_agent_model: claude-sonnet-5
