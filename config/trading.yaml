# Configurazione della piattaforma crypto continua: simboli tracciati, cadenze
# dei due cicli (analisi lenta + esecuzione veloce), parametri di esecuzione
# simulata (futures USDT-M perpetual su Binance) e limiti di rischio.
# Tutti i valori sono modificabili senza toccare il codice.
#
# Perimetro: simboli scelti dinamicamente a ogni avvio di sessione dallo
# screener (agents/symbol_screener_agent.py) tra i candidati elencati in
# symbol_universe, in base a volatilità/liquidità delle ultime 24h — non per
# forza Bitcoin/Solana/altri simboli "storici".

# Quanti simboli sceglie lo screener per sessione: più alto aumenta la
# probabilità che, oltre alla volatilità (criterio dello screener), alcuni
# abbiano anche fondamentali abbastanza chiari da generare una direzione
# tradabile invece di "flat" (la Strategy Agent decide long/short/flat solo
# sui fondamentali, non sulla volatilità a breve termine — i due criteri
# non sono la stessa cosa, un simbolo può essere molto volatile e avere
# comunque segnali fondamentali contrastanti). Costo: più simboli da
# seguire in parallelo, più token per ciclo lento (stesso numero di
# chiamate Claude, batch più grandi).
symbols_per_session: 6

symbol_universe:
  - symbol: BTC
    coingecko_id: bitcoin
    binance_perp: BTCUSDT
  - symbol: ETH
    coingecko_id: ethereum
    binance_perp: ETHUSDT
  - symbol: SOL
    coingecko_id: solana
    binance_perp: SOLUSDT
  - symbol: XRP
    coingecko_id: ripple
    binance_perp: XRPUSDT
  - symbol: DOGE
    coingecko_id: dogecoin
    binance_perp: DOGEUSDT
  - symbol: ADA
    coingecko_id: cardano
    binance_perp: ADAUSDT
  - symbol: AVAX
    coingecko_id: avalanche-2
    binance_perp: AVAXUSDT
  - symbol: LINK
    coingecko_id: chainlink
    binance_perp: LINKUSDT
  - symbol: DOT
    coingecko_id: polkadot
    binance_perp: DOTUSDT
  - symbol: LTC
    coingecko_id: litecoin
    binance_perp: LTCUSDT
  - symbol: NEAR
    coingecko_id: near
    binance_perp: NEARUSDT
  - symbol: APT
    coingecko_id: aptos
    binance_perp: APTUSDT
  - symbol: ARB
    coingecko_id: arbitrum
    binance_perp: ARBUSDT
  - symbol: OP
    coingecko_id: optimism
    binance_perp: OPUSDT
  - symbol: SUI
    coingecko_id: sui
    binance_perp: SUIUSDT
  - symbol: INJ
    coingecko_id: injective-protocol
    binance_perp: INJUSDT
  - symbol: TIA
    coingecko_id: celestia
