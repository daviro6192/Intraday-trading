[project]
name = "intraday-trading"
version = "0.1.0"
description = "Piattaforma di trading intraday multi-agente basata su Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "feedparser>=6.0",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "ta>=0.11.0",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "ib_async>=1.0.1",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "broker*", "common*", "config*", "data_sources*", "orchestrator*", "storage*"]
